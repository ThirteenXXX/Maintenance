<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zepra Wallet - Maintenance</title>
  <link rel="stylesheet" href="./assets/css/index.css"/>
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/img/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/img/favicon-16x16.png">
  <link rel="manifest" href="./assets/img/site.webmanifest">
  <style>
    body {
  margin: 0;
  padding: 0;
  height: 100vh;
  font-family: 'Space Grotesk', sans-serif;
  background: linear-gradient(135deg, #1a1a1a, #000); /* FULL GRADIENT */
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

    .maintenance-wrapper {
      max-width: 600px;
    }

    .maintenance-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: white;
    }

    .maintenance-text {
      font-size: 1.2rem;
      color: #cccccc;
      margin-bottom: 2rem;
    }

    .btn-back {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      background: linear-gradient(135deg, #7b61ff, #9a6dff, #b891ff);
      background-size: 200% auto;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      text-decoration: none;
      transition: 0.4s ease-in-out;
      box-shadow: 0 0 20px rgba(123, 97, 255, 0.35);
      position: relative;
      overflow: hidden;
    }

    .btn-back:hover {
      background-position: right center;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 30px rgba(123, 97, 255, 0.6);
    }

    .btn-back::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: skewX(-20deg);
    }

    .btn-back:hover::after {
      animation: shine 1.2s forwards;
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 150%; }
    }
  </style>
</head>
<body>
  <div class="maintenance-wrapper">
    <h1 class="maintenance-title">We’ll Be Right Back</h1>
    <p class="maintenance-text">Zepra Wallet is currently undergoing scheduled maintenance to improve your experience. Thank you for your patience.</p>
    <a href="https://zepra.pro" class="btn-back">Back to Home</a>
  </div>
</body>
</html>
